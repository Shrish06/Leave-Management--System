# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Datasource
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT Configuration
# ==============================
# 256-bit secret used to sign JWT tokens (change this in production / move to env var)
app.jwt.secret=ThisIsASecretKeyForLeaveManagementSystemJWTTokenGenerationChangeIt
app.jwt.expiration-ms=86400000

# ==============================
# Default Leave Balance (days per year) for a newly registered employee
# ==============================
app.leave.default-balance=20

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=INFO
logging.level.com.company.leavemanagement=DEBUG

# ==============================
# springdoc-openapi (Swagger UI at /swagger-ui.html)
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
